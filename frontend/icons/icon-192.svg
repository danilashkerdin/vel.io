<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676"/>
      <stop offset="100%" style="stop-color:#00c853"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00e676;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Glow circle -->
  <circle cx="256" cy="220" r="180" fill="url(#glow)"/>

  <!-- Bicycle silhouette -->
  <g transform="translate(256, 240) scale(1.1)">
    <!-- Back wheel -->
    <circle cx="-80" cy="60" r="48" fill="none" stroke="#fff" stroke-width="5" opacity="0.9"/>
    <circle cx="-80" cy="60" r="48" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>

    <!-- Front wheel -->
    <circle cx="80" cy="60" r="48" fill="none" stroke="#fff" stroke-width="5" opacity="0.9"/>
    <circle cx="80" cy="60" r="48" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>

    <!-- Wheel spokes -->
    <g stroke="#fff" stroke-width="1.5" opacity="0.3">
      <line x1="-80" y1="12" x2="-80" y2="108"/>
      <line x1="-128" y1="60" x2="-32" y2="60"/>
      <line x1="-114" y1="26" x2="-46" y2="94"/>
      <line x1="-46" y1="26" x2="-114" y2="94"/>
      <line x1="80" y1="12" x2="80" y2="108"/>
      <line x1="32" y1="60" x2="128" y2="60"/>
      <line x1="34" y1="26" x2="126" y2="94"/>
      <line x1="126" y1="26" x2="34" y2="94"/>
    </g>

    <!-- Frame: seat tube -->
    <line x1="-30" y1="-40" x2="-50" y2="30" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <!-- Frame: top tube -->
    <line x1="-30" y1="-40" x2="40" y2="-20" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <!-- Frame: down tube -->
    <line x1="-50" y1="30" x2="40" y2="-20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <!-- Frame: chain stay -->
    <line x1="-50" y1="30" x2="-80" y2="60" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <!-- Frame: seat stay -->
    <line x1="-30" y1="-40" x2="-80" y2="60" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <!-- Frame: fork -->
    <line x1="40" y1="-20" x2="80" y2="60" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

    <!-- Seat -->
    <ellipse cx="-30" cy="-48" rx="14" ry="5" fill="#fff"/>

    <!-- Handlebar -->
    <line x1="40" y1="-20" x2="50" y2="-35" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="-35" x2="65" y2="-25" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>

    <!-- Crank / pedals -->
    <circle cx="-50" cy="30" r="6" fill="url(#accent)"/>
    <line x1="-50" y1="22" x2="-50" y2="38" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <rect x="-54" y="18" width="8" height="4" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="-54" y="36" width="8" height="4" rx="2" fill="#fff" opacity="0.7"/>

    <!-- Rear dropouts -->
    <circle cx="-80" cy="60" r="6" fill="url(#accent)"/>
    <!-- Front dropouts -->
    <circle cx="80" cy="60" r="6" fill="url(#accent)"/>
  </g>

  <!-- Moving lines (speed effect) -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.2" stroke-linecap="round">
    <line x1="160" y1="420" x2="200" y2="420"/>
    <line x1="280" y1="440" x2="310" y2="440"/>
    <line x1="350" y1="410" x2="370" y2="410"/>
    <line x1="140" y1="400" x2="170" y2="400"/>
  </g>
</svg>