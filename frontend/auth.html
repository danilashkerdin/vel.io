<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4a90e2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Velo.io">
    <meta name="description" content="Игра для велосипедистов. Захватывай территории, соревнуйся с другими и зарабатывай.">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Velo.io — Вход</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
    <div class="auth-card">
        <h1>🚴 Velo.io</h1>
        <div class="role-tabs" id="roleTabs" style="display:none">
            <button class="role-tab active" data-role="cyclist">🚴 Велосипедист</button>
            <button class="role-tab" data-role="advertiser">📢 Рекламодатель</button>
        </div>
        <p class="subtitle" id="subtitle">Войдите чтобы захватывать территории</p>
        <div class="error" id="error"></div>
        <input type="text" id="username" placeholder="Имя" />
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Пароль" />
        <button id="submitBtn">Войти</button>
        <p class="toggle" id="toggleBtn">Нет аккаунта? Зарегистрироваться</p>
    </div>

    <script type="module" src="js/auth-page.js"></script>
</body>
</html>
