server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # HTTPS redirect (activate in production behind a reverse proxy / load balancer)
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Efficient static file serving
    sendfile on;
    tcp_nopush on;

    # Gzip сжатие — экономит 60-80% трафика
    gzip on;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Кэш статики на 30 дней
    location ~* \.(css|js|jpg|png|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PWA — манифест без кэша, sw.js с no-cache
    location = /manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /icons/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API прокси на бэкенд
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Лимит загрузки файлов (10MB для GPX)
        client_max_body_size 10M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
